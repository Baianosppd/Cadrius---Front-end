# Desenvolvimento local com hot reload:  docker compose up --build   →  http://localhost:5173
# (o back-end roda no repositório do Cadrius: http://localhost:8000)
services:
  frontend:
    container_name: cadrius_frontend
    build:
      context: .
      target: dev
    ports:
      - "5173:5173"
    volumes:
      - ./src:/app/src
      - ./public:/app/public
      - ./index.html:/app/index.html
      - /app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000/api/v1/}
      VITE_ALLOWED_HOSTS: ${VITE_ALLOWED_HOSTS:-localhost}

  # Imagem de produção (nginx) para testar localmente:  docker compose --profile prod up --build frontend-prod → http://localhost:8080
  frontend-prod:
    profiles: ["prod"]
    build:
      context: .
      target: prod
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000/api/v1/}
    environment:
      API_ORIGIN: ${API_ORIGIN:-http://localhost:8000}
    ports:
      - "8080:8080"
