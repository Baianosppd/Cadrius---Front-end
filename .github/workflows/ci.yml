name: CI (lint, build e segurança)

on:
  pull_request:
    branches: [main, Develop]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualidade:
    name: Lint, build e dependências
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Lint (erros bloqueiam; avisos não)
        run: npm run lint
      - name: Testes unitários
        run: npm test
      - name: Build de produção
        run: npm run build
        env:
          VITE_API_URL: https://api-teste.cadrius.ia.br/api/v1/
      - name: Vulnerabilidades (dependências de produção)
        run: npm audit --omit=dev --audit-level=high

  docker:
    name: Imagem de produção (nginx)
    runs-on: ubuntu-latest
    needs: [qualidade]
    steps:
      - uses: actions/checkout@v7
      - name: Build da imagem
        run: docker build --target prod --build-arg VITE_API_URL=https://api-teste.cadrius.ia.br/api/v1/ -t cadrius-front:ci .
      - name: Subir e testar /healthz e o fallback da SPA
        run: |
          docker run -d --name front -p 8080:8080 -e API_ORIGIN=https://api-teste.cadrius.ia.br cadrius-front:ci
          for i in $(seq 1 20); do curl -fsS localhost:8080/healthz && break; sleep 1; done
          curl -fsS localhost:8080/rota-inexistente | grep -q '<div id="root">'
          curl -sI localhost:8080/ | grep -qi 'content-security-policy'
